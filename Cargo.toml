[package]
name = "anarchy"
version = "0.1.0"
edition = "2024"

[features]
log-trace = []
single-threaded-executors = []
multi-threaded-executors = []

[dependencies]
ahash = "0.8.12"
anarchy_macros = { path = "./macros" }
anyhow = "1.0.104"

chrono = "0.4.45"
convert_case = "0.11.0"
derive_more = "2.1.1"
itertools = "0.14.0"
lazy_static = "1.5.0"
mutual = "1.0.2"
pollster = "0.4.0"
threadpool = "1.8.1"
tokio = { version = "1.52.3", features = ["full"] }
