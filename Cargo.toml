[package]
name = "anarchy"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anarchy_macros = { path = "./macros" }
anyhow = "1.0.104"
crossbeam-queue = "0.3.14"
derive_more = "2.1.1"
double_linked_list = "0.1.2"
getset = "0.1.7"
inventory = "0.3.25"
mutual = "1.0.2"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"], optional = true }
web-time = "1.1.0"

[features]
# Serialize and Deserialize for `Value` and the editing types, and Serialize for `TypeInfo`
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"

# criterion uses rayon, which doesn't build for wasm; the benches are native only
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "query"
harness = false

# ahash seeds its hashers through getrandom, which needs its JS backend on the web
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "serde_editor"
required-features = ["serde"]
